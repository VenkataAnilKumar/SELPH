name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: src/backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: src/backend
        run: pytest tests/ -v --tb=short

      - name: Golden-prompt evals (>=95% required)
        working-directory: src/backend
        run: python -m evals.run_evals

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck web, landing
        run: |
          npx tsc --noEmit -p src/web
          npx tsc --noEmit -p src/landing

      - name: Run web tests
        run: npm test --workspace=src/web -- --runInBand --ci

      - name: Build web
        run: npm run build --workspace=src/web

      - name: Landing tests
        run: npm test --workspace=src/landing

      - name: Build landing (static export)
        run: npm run build --workspace=src/landing

  test-mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npx tsc --noEmit -p src/mobile

      - name: Run mobile tests
        run: npm test --workspace=src/mobile -- --runInBand --ci

  docker-stack:
    name: Docker Stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the compose stack
        run: docker compose up --build -d

      - name: Wait for the API to be ready (migrations run on start)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ready >/dev/null 2>&1; then echo "ready after $((i*3))s"; exit 0; fi
            sleep 3
          done
          echo "API never became ready"; docker compose logs backend | tail -50; exit 1

      - name: Worker can run every job the app publishes
        run: |
          # Every task module is registered (an unregistered task is discarded by the worker)
          docker compose exec -T celery_worker celery -A app.celery_app inspect registered | tee /tmp/registered.txt
          for t in push_notifications.notify_draft_ready push_notifications.notify_vip_message send_reply.send_channel_reply draft_generation.generate_draft_for_message; do
            grep -q "$t" /tmp/registered.txt || { echo "worker has not registered $t"; exit 1; }
          done
          # ...and consumes every queue (delivery jobs go to "channels")
          docker compose exec -T celery_worker celery -A app.celery_app inspect active_queues | tee /tmp/queues.txt
          for q in celery draft_generation message_processing voice_synthesis avatar_generation channels; do
            grep -q "'name': '$q'" /tmp/queues.txt || { echo "worker does not consume queue $q"; exit 1; }
          done

      - name: Walk through the product against the running stack
        run: |
          pip install httpx
          python src/backend/scripts/local_e2e.py

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=80

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  migration-smoke:
    name: Migration Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: selph
          POSTGRES_PASSWORD: selph_dev_password
          POSTGRES_DB: selph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selph -d selph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: src/backend
        run: pip install -r requirements.txt

      - name: Run migration + Phase 10 smoke
        working-directory: .
        env:
          DATABASE_URL: postgresql://selph:selph_dev_password@127.0.0.1:5432/selph
          ENVIRONMENT: development
        run: npm run smoke:backend:migrate

      - name: Migration round-trip (up, down one-by-one, up)
        working-directory: src/backend
        env:
          DATABASE_URL: postgresql://selph:selph_dev_password@127.0.0.1:5432/selph
          ENVIRONMENT: development
        run: python scripts/check_migrations_roundtrip.py --yes-destroy-data

      - name: Seed script runs on a fresh migrated database
        working-directory: src/backend
        env:
          DATABASE_URL: postgresql://selph:selph_dev_password@127.0.0.1:5432/selph
          ENVIRONMENT: development
        run: python scripts/seed_dev.py
